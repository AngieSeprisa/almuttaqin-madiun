name: Deploy to VPS

on:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create git bundle and deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          git bundle create /tmp/deploy.bundle main

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/id_deploy /tmp/deploy.bundle "${VPS_USERNAME}@${VPS_HOST}:/tmp/deploy.bundle"

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/id_deploy "${VPS_USERNAME}@${VPS_HOST}" '
            set -e
            cd /var/www/al-muttaqin
            git config --global --add safe.directory /var/www/al-muttaqin
            git config core.fileMode false
            git fetch --force /tmp/deploy.bundle main:refs/remotes/origin/main
            rm -f /tmp/deploy.bundle
            git reset --hard origin/main
            php artisan storage:link || true
            php artisan migrate --force
            php artisan optimize:clear
            php artisan view:clear
            php artisan optimize
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R ug+rwX storage bootstrap/cache
          '
