name: Deploy to VPS

on:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy via SSH
        id: ssh_primary
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 35s
          command_timeout: 90s
          script_stop: true
          script: |
            cd /var/www/al-muttaqin
            git config --global --add safe.directory /var/www/al-muttaqin
            git config core.fileMode false
            git fetch origin main || (sleep 3 && git fetch origin main)
            git reset --hard origin/main
            php artisan storage:link || true
            php artisan migrate --force
            php artisan optimize:clear
            php artisan view:clear
            php artisan optimize
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R ug+rwX storage bootstrap/cache

      - name: Retry Deploy via SSH on transient failure
        if: steps.ssh_primary.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 120s
          script_stop: true
          script: |
            sleep 3
            cd /var/www/al-muttaqin
            git config --global --add safe.directory /var/www/al-muttaqin
            git config core.fileMode false
            git fetch origin main || (sleep 3 && git fetch origin main)
            git reset --hard origin/main
            php artisan storage:link || true
            php artisan migrate --force
            php artisan optimize:clear
            php artisan view:clear
            php artisan optimize
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R ug+rwX storage bootstrap/cache
